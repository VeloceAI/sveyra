<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVEYRA Human Engine - Debug Viewer</title>
<style>
  :root {
    --bg: #14161c; --panel: #1e222b; --line: #2c3240;
    --text: #e6e9f2; --muted: #98a0b3; --accent: #7f9cf5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; }
  #panel {
    position: fixed; top: 16px; left: 16px; width: 250px;
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
    backdrop-filter: blur(8px);
  }
  h1 { margin: 0 0 2px; font-size: 14px; letter-spacing: -0.01em; }
  .sub { margin: 0 0 12px; color: var(--muted); font-size: 11.5px; }
  label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--accent); }
  .file {
    display: block; width: 100%; margin: 4px 0 12px; padding: 7px 8px;
    background: #171a22; border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); font-size: 12px;
  }
  hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  #stats { color: var(--muted); font-size: 11.5px; white-space: pre-line; }
  #err { color: #f2a2a2; font-size: 11.5px; margin-top: 8px; }
  kbd {
    background: #171a22; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 4px; font-size: 11px;
  }
</style>
</head>
<body>
<div id="stage"></div>

<div id="panel">
  <h1>SVEYRA Human Engine</h1>
  <p class="sub">Debug viewer &middot; v0.1</p>

  <input class="file" type="file" id="pick" accept=".glb,.gltf">

  <label><input type="checkbox" id="wire"> Wireframe</label>
  <label><input type="checkbox" id="normals"> Normals</label>
  <label><input type="checkbox" id="grid" checked> Ground grid</label>
  <label><input type="checkbox" id="axes"> Axes</label>
  <label><input type="checkbox" id="skeleton"> Skeleton</label>
  <label><input type="checkbox" id="pose"> Wave (test the rig)</label>
  <label><input type="checkbox" id="spin"> Auto-rotate</label>

  <hr>
  <div id="stats">No model loaded.</div>
  <div id="err"></div>
  <hr>
  <div class="sub" style="margin:0">
    Drag to orbit &middot; scroll to zoom<br>
    <kbd>R</kbd> reset view
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { VertexNormalsHelper } from "three/addons/helpers/VertexNormalsHelper.js";

const stage = document.getElementById("stage");
const statsEl = document.getElementById("stats");
const errEl = document.getElementById("err");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161c);

const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x1a1d25, 2.0));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(2, 3, 2.5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x93a8ff, 0.7);
fill.position.set(-2.5, 1, -2);
scene.add(fill);

const grid = new THREE.GridHelper(4, 20, 0x3a4152, 0x272c38);
scene.add(grid);
const axes = new THREE.AxesHelper(0.5);
axes.visible = false;
scene.add(axes);

let current = null;
let normalsHelper = null;
let skeletonHelper = null;
let skinnedMesh = null;
let armBone = null;

function frame(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z);
  controls.target.set(centre.x, centre.y, centre.z);
  camera.position.set(centre.x + radius * 0.9, centre.y + radius * 0.15, centre.z + radius * 2.0);
  camera.near = radius / 100;
  camera.far = radius * 100;
  camera.updateProjectionMatrix();
  controls.update();
  return { size, box };
}

function describe(object, size) {
  let verts = 0, tris = 0;
  object.traverse((child) => {
    if (!child.isMesh) return;
    const g = child.geometry;
    verts += g.attributes.position.count;
    tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
  });
  statsEl.textContent =
    `vertices   ${verts.toLocaleString()}\n` +
    `triangles  ${Math.round(tris).toLocaleString()}\n` +
    `height     ${(size.y * 100).toFixed(1)} cm\n` +
    `width      ${(size.x * 100).toFixed(1)} cm\n` +
    `depth      ${(size.z * 100).toFixed(1)} cm`;
}

function clear() {
  if (!current) return;
  scene.remove(current);
  if (skeletonHelper) { scene.remove(skeletonHelper); skeletonHelper = null; }
  current.traverse((c) => {
    if (c.isMesh) { c.geometry.dispose(); c.material.dispose(); }
  });
  current = null;
  if (normalsHelper) { scene.remove(normalsHelper); normalsHelper = null; }
}

function load(url) {
  errEl.textContent = "";
  new GLTFLoader().load(url, (gltf) => {
    clear();
    current = gltf.scene;
    scene.add(current);

    skinnedMesh = null;
    armBone = null;
    current.traverse((c) => {
      if (c.isSkinnedMesh && !skinnedMesh) skinnedMesh = c;
      if (c.isBone && c.name === "upperarm_L") armBone = c;
    });
    if (skinnedMesh) {
      skeletonHelper = new THREE.SkeletonHelper(current);
      skeletonHelper.visible = document.getElementById("skeleton").checked;
      scene.add(skeletonHelper);
    }
    const { size } = frame(current);
    describe(current, size);
    applyToggles();
  }, undefined, (e) => {
    errEl.textContent = "Could not load that file. " + (e?.message ?? "");
  });
}

function applyToggles() {
  if (!current) return;
  const wire = document.getElementById("wire").checked;
  current.traverse((c) => { if (c.isMesh) c.material.wireframe = wire; });

  const wantNormals = document.getElementById("normals").checked;
  if (wantNormals && !normalsHelper) {
    current.traverse((c) => {
      if (c.isMesh && !normalsHelper) {
        normalsHelper = new VertexNormalsHelper(c, 0.02, 0x7f9cf5);
        scene.add(normalsHelper);
      }
    });
  } else if (!wantNormals && normalsHelper) {
    scene.remove(normalsHelper);
    normalsHelper = null;
  }
}

for (const id of ["wire", "normals"]) {
  document.getElementById(id).addEventListener("change", applyToggles);
}
document.getElementById("grid").addEventListener("change", (e) => {
  grid.visible = e.target.checked;
});
document.getElementById("skeleton").addEventListener("change", (e) => {
  if (skeletonHelper) skeletonHelper.visible = e.target.checked;
});
document.getElementById("axes").addEventListener("change", (e) => {
  axes.visible = e.target.checked;
});
document.getElementById("spin").addEventListener("change", (e) => {
  controls.autoRotate = e.target.checked;
});
document.getElementById("pick").addEventListener("change", (e) => {
  const file = e.target.files?.[0];
  if (file) load(URL.createObjectURL(file));
});
addEventListener("keydown", (e) => {
  if (e.key.toLowerCase() === "r" && current) frame(current);
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

// Load ./avatar.glb if one has been placed next to this file.
fetch("avatar.glb", { method: "HEAD" })
  .then((r) => { if (r.ok) load("avatar.glb"); })
  .catch(() => {});

// A crude arm wave, purely to prove the skin weights actually deform the mesh.
const clock = new THREE.Clock();
(function tick() {
  requestAnimationFrame(tick);
  if (armBone) {
    const on = document.getElementById("pose").checked;
    armBone.rotation.z = on ? Math.sin(clock.getElapsedTime() * 2) * 0.6 : 0;
  }
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
