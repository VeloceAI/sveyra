<title>SVEYRA Human Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
  /* Committed dark stage: this is a model viewer, and the mesh is the subject.
     Every colour is painted explicitly so the page holds on any host ground. */
  :root {
    --void:    #14100D;
    --stage:   #1A1613;
    --panel:   #1F1A15;
    --raised:  #29221B;
    --line:    #382E24;
    --text:    #F0E6DA;
    --muted:   #A2917E;
    --clay:    #E0A46B;
    --measure: #C99A63;
    --ok:      #7BC49A;

    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--void);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  #stage { position: fixed; inset: 0; background: var(--stage); }
  canvas { display: block; }

  /* ---------- masthead ---------- */

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 14px 20px;
    background: linear-gradient(to bottom, rgba(20,16,13,.92), rgba(20,16,13,0));
    pointer-events: none;
    z-index: 3;
  }
  header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header .sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  /* ---------- panels ---------- */

  .panel {
    position: fixed;
    background: color-mix(in srgb, var(--panel) 94%, transparent);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    backdrop-filter: blur(10px);
    z-index: 4;
  }

  #controls { top: 62px; left: 20px; width: 236px; }
  #readout  { top: 62px; right: 20px; width: 232px; }

  .panel h2 {
    margin: 0 0 10px;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .variants { display: flex; flex-direction: column; gap: 5px; }

  .variant {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px 10px;
    background: var(--raised);
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }
  .variant:hover { border-color: var(--line); }
  .variant[aria-pressed="true"] {
    border-color: var(--clay);
    background: color-mix(in srgb, var(--clay) 14%, var(--raised));
  }
  .variant .delta {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
  }
  .variant[aria-pressed="true"] .delta { color: var(--clay); }

  .blend { margin-top: 14px; }
  .blend label {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .blend .amount { color: var(--clay); }
  input[type="range"] { width: 100%; accent-color: var(--clay); }

  .toggles {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .toggles label {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    cursor: pointer;
  }
  input[type="checkbox"] { accent-color: var(--measure); }

  /* ---------- measurements ---------- */

  .rows { display: flex; flex-direction: column; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    padding: 5px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .row .name { color: var(--muted); font-size: 12.5px; }
  .row .value {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--text);
  }
  .row .value .unit { color: var(--muted); font-size: 11px; margin-left: 2px; }
  .row.changed .value { color: var(--clay); }

  .note {
    margin: 12px 0 0;
    font-size: 11.5px;
    line-height: 1.45;
    color: var(--muted);
  }

  /* ---------- footer ---------- */

  footer {
    position: fixed;
    left: 20px; bottom: 16px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.04em;
    z-index: 3;
  }
  footer b { color: var(--ok); font-weight: 500; }

  #hint {
    position: fixed;
    right: 20px; bottom: 16px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    z-index: 3;
  }

  @media (max-width: 780px) {
    #controls, #readout {
      position: static;
      width: auto;
      margin: 0 12px 12px;
    }
    body { overflow: auto; }
    #stage { position: relative; height: 58vh; inset: auto; }
    header { position: static; background: none; }
    footer, #hint { position: static; margin: 0 12px 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<div id="stage"></div>

<header>
  <h1>SVEYRA Human Engine</h1>
  <span class="sub">3,528 vertices · 6,768 triangles · built on CPU</span>
</header>

<section class="panel" id="controls">
  <h2>Body</h2>
  <div class="variants" id="variants"></div>

  <div class="blend">
    <label for="blend">
      <span>Blend</span>
      <span class="amount" id="blend-amount">100%</span>
    </label>
    <input type="range" id="blend" min="0" max="100" value="100">
  </div>

  <div class="toggles">
    <label><input type="checkbox" id="wire"> Wireframe</label>
    <label><input type="checkbox" id="bones"> Skeleton</label>
    <label><input type="checkbox" id="spin"> Turntable</label>
    <button type="button" class="variant" id="reset" style="margin-top:8px"><span>Reset pose</span><span class="delta">T-pose</span></button>
    <button type="button" class="variant" id="reset" style="margin-top:8px"><span>Reset pose</span><span class="delta">T-pose</span></button>
  </div>
</section>

<section class="panel" id="readout">
  <h2>Measurements</h2>
  <div class="rows" id="rows"></div>
  <p class="note" id="note"></p>
</section>

<footer>Every body shares one topology &middot; <b>morph-compatible</b></footer>
<div id="hint">drag to orbit &middot; show the skeleton, then drag a joint to pose</div>
